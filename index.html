<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>mapAED</title>
    <link rel="icon" type="image/x-icon" href="media/logopion.webp">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <header>
        <div id="header_left">
            <img src="media/logopoziom.png" alt="Logo" id="header_logo">
            <span id="header_title">Serwis danych o miejscach z AED</span>
        </div>
        <div id="header_right">
            <button type="button" class="wcag-btn" onclick="changeFontSize(-1)" title="Zmniejsz czcionkę">A-</button>
                <button type="button" class="wcag-btn" onclick="resetFontSize()" title="Domyślny rozmiar czcionki">A</button>
                <button type="button" class="wcag-btn" onclick="changeFontSize(1)" title="Zwiększ czcionkę">A+</button>
                <button type="button" class="wcag-btn" id="contrast_btn" onclick="toggleHighContrast()" title="Włącz wysoki kontrast"><img src="media/polkolko.png" id="contrast_img"></button>
        </div>
    </header>
    <main>
        
            <article id="file_import_container">
                <h2>Import danych</h2>
                <div id="obramowka" class="dropbox" onclick="document.getElementById('file-import').click()">
                    <form id="plik" method="" action="">
                        <span id="file_text">Kliknij aby wybrać plik</span>
                        <input type="file" name="file" id="file-import">
                    </form>
                </div> 
                <span>Obsługiwane rozszerzenia plików: XLSX</span>
            </article>
            <article id="main_article" style="display: none;">
                <form id="upload_form">
                    <h2>Manualne edytowanie</h2>
                    <p><div id="table_wrapper"><table id="manual_data"></table></div></p>
                    <button type="button" id="add_row" class="row_btn">+ Dodaj rekord</button>
                    <label for="publisher" style="margin-left: 3rem;font-weight: 600;">Podpisz instytucję: </label>
                    <input type="text" name="publisher" id="publisher">
                    <input type="submit" value="Wyślij plik" id="file_submit">
                </form>
            </article>
            <article id="export_article" style="display: none;">
                <p>
                    <div id="export_wrapper" class="dropbox" onclick="exportXlsx()">
                        <img src="media/export.png" alt="Pobierz plik z wszystkimi punktami AED" id="export_png"><br>
                        <span id="export_span">Pobierz plik z wszystkimi punktami AED</span>
                    </div>
                </p>
                <span><a href="#" onclick="exportJson(); return false;">lub pobierz jako JSON</a></span>
            </article>
            <article id="file_import_container2" style="display: none;">
                <h2>Import danych</h2>
                <div id="obramowka2" class="dropbox" onclick="document.getElementById('file-import').click()">
                    <form id="plik" method="" action="">
                        <span id="file_text">Kliknij aby wybrać plik</span>
                        <input type="file" name="file" id="file-import">
                    </form>
                </div> 
                <span>Obsługiwane rozszerzenia plików: XLSX</span>

            </article>
            <footer>
                <br><hr><br>
            </footer>
    </main>
</body>
<script>
    let currentFontScale = 16;

    const COLS = ["id", "lat", "lon", "hours", "position", "location", "description"];
    const HEADERS = ["ID AED", "Szerokość geograficzna", "Długość geograficzna",
                     "Godziny dostępu", "Położenie", "Lokalizacja", "Krótki opis"];

    const excel_file = document.getElementById("file-import");

    const esc = (v) => String(v ?? "")
        .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
        .replace(/</g, "&lt;").replace(/>/g, "&gt;");
    
     function rowHtml(values = []) {
        const cells = COLS.map((_, i) => {
            const isNum = (i === 1 || i === 2);
            return `<td><input type="${isNum ? "number" : "text"}"${isNum ? ' step="0.000001"' : ""} value="${esc(values[i])}"></td>`;
        }).join("");
        return `<tr>${cells}<td><button type="button" class="row_btn" onclick="deleteRow(this)" title="Usuń rekord">✕</button></td></tr>`;
    }

    function addRow() {
        const table = document.getElementById("manual_data");
        (table.tBodies[0] || table).insertAdjacentHTML("beforeend", rowHtml());
        const last = table.querySelector("tr:last-child input");
        last.scrollIntoView({ block: "center" });
        last.focus();
    }

    function deleteRow(btn) {
        btn.closest("tr").remove();
    }

    document.getElementById("add_row").addEventListener("click", addRow);

    // ---------- IMPORT XLSX → tabela ----------
    excel_file.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (!/\.xlsx?$/i.test(file.name)) {
            alert("Dozwolone są tylko pliki .xlsx lub .xls");
            excel_file.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            const wb = XLSX.read(new Uint8Array(reader.result), { type: "array" });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
                { header: 1, defval: "", blankrows: false });

            // jeśli pierwszy wiersz to nagłówek (szerokość nie jest liczbą) – pomijamy go
            if (rows.length && isNaN(parseFloat(String(rows[0][1]).replace(",", ".")))) rows.shift();

            if (!rows.length) {
                alert("Plik nie zawiera danych.");
                excel_file.value = "";
                return;
            }
            if (rows.some(r => r.length !== 7)) {
                alert("Źle sformatowany plik, musi zawierać 7 kolumn!");
                excel_file.value = "";
                return;
            }

            const head = "<tr>" + HEADERS.map(h => `<th>${h}</th>`).join("") + "<th></th></tr>";
            const body = rows.map(r => rowHtml(r)).join("");

            document.getElementById("manual_data").innerHTML = head + body;
            document.getElementById("main_article").style = "display: block;";
            document.getElementById("export_article").style = "display: block;";
            document.getElementById("file_import_container").style = "display: none;";
            document.getElementById("file_import_container2").style = "height: 360px; display: block;";
            document.getElementById("obramowka2").style = "height: 70%;";

            excel_file.value = "";
        };
        reader.readAsArrayBuffer(file);
    });

    // ---------- WYSYŁKA tabeli na serwer (→ Firebase) ----------
    document.getElementById("upload_form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const publisher = document.getElementById("publisher").value.trim();
        if (!publisher) {
            alert("Podpisz instytucję.");
            return;
        }

        const points = [...document.querySelectorAll("#manual_data tr")].slice(1).map(tr => {
            const v = [...tr.querySelectorAll("input")].map(i => i.value.trim());
            return Object.fromEntries(COLS.map((c, i) => [c, v[i]]));
        }).filter(p => COLS.some(c => p[c]));

        if (!points.length) {
            alert("Brak rekordów do wysłania.");
            return;
        }

        const btn = document.getElementById("file_submit");
        btn.disabled = true;
        try {
            const res = await fetch("/upload", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ publisher, points })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ("Błąd serwera (" + res.status + ")"));
            alert("Wysłano punktów: " + data.count);
        } catch (err) {
            alert("Nie udało się wysłać danych: " + err.message);
        } finally {
            btn.disabled = false;
        }
    });

    // ---------- EKSPORT wszystkich punktów z bazy ----------
    async function fetchPoints() {
        const res = await fetch("/points");
        if (!res.ok) throw new Error("Błąd serwera (" + res.status + ")");
        return res.json();
    }

    async function exportXlsx() {
        try {
            const pts = await fetchPoints();
            if (!pts.length) { alert("Baza jest pusta."); return; }
            // te same kolumny co przy imporcie – pobrany plik można wgrać z powrotem
            const aoa = [HEADERS, ...pts.map(p => COLS.map(c => p[c] ?? ""))];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "AED");
            XLSX.writeFile(wb, "punkty_AED.xlsx");
        } catch (err) {
            alert("Nie udało się pobrać danych: " + err.message);
        }
    }

    async function exportJson() {
        try {
            const pts = await fetchPoints();
            if (!pts.length) { alert("Baza jest pusta."); return; }
            const blob = new Blob([JSON.stringify(pts, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "punkty_AED.json";
            a.click();
            URL.revokeObjectURL(a.href);
        } catch (err) {
            alert("Nie udało się pobrać danych: " + err.message);
        }
    }

    // ---------- WCAG ----------
    function changeFontSize(delta) {
        currentFontScale = Math.max(12, Math.min(24, currentFontScale + (delta * 2)));
        document.documentElement.style.setProperty('--font-scale', currentFontScale + 'px');
    }

    function resetFontSize() {
        currentFontScale = 16;
        document.documentElement.style.setProperty('--font-scale', '16px');
    }

    function toggleHighContrast() {
        document.body.classList.toggle('high-contrast');
        const on = document.body.classList.contains('high-contrast');
        document.getElementById("header_logo").src = on ? "media/invertedlogopoziom.png" : "media/logopoziom.png";
        document.getElementById("contrast_img").src = on ? "media/bialepolkolko.png" : "media/polkolko.png";
    }
</script>
</html>
